spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-show-sql=true

jwt.secret=chave-para-testes-automatizados-com-minimo-256-bits-nunca-usar-em-producao
jwt.expiration-ms=86400000

# Nos testes o job não roda sozinho: os testes chamam VerificacaoCpfService.processarPendentes()
verificacao.cpf.job.enabled=false
verificacao.cpf.fake.rejeitados=
verificacao.cpf.fake.falhas=
