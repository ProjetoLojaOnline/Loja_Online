# Verificação assíncrona de CPF (issue #140)
# Carregado pelo spring.config.import do application.properties.
# Variáveis de ambiente e argumentos de linha de comando continuam sobrescrevendo estes valores.

# Provedor: "fake" até o time escolher um provedor real (não existe API pública gratuita de CPF)
verificacao.cpf.provedor=fake

# Job agendado
verificacao.cpf.job.enabled=true
# Formato ISO-8601 (PT30S = 30 segundos)
verificacao.cpf.job.intervalo=PT30S
verificacao.cpf.job.atraso-inicial=PT10S
verificacao.cpf.job.lote=50
verificacao.cpf.job.backoff-inicial=1m
verificacao.cpf.job.backoff-maximo=1h
verificacao.cpf.job.reverificar-rejeitados-apos=7d

# Client HTTP do provedor real
verificacao.cpf.http.base-url=
verificacao.cpf.http.connect-timeout=5s
verificacao.cpf.http.read-timeout=60s

# Só para o provedor fake: CPFs fictícios (só dígitos, separados por vírgula)
# rejeitados -> o fake responde que o CPF não existe (status REJEITADO)
verificacao.cpf.fake.rejeitados=52998224725
# falhas -> o fake simula erro do provedor (continua PENDENTE e o job tenta de novo com backoff)
verificacao.cpf.fake.falhas=11144477735
