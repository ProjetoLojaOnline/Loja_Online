spring.application.name=loja_online

spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/loja_online}
spring.datasource.username=${DB_USER:app_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuator: expõe apenas /actuator/health (usado pelo HEALTHCHECK do Docker)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

