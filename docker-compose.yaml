services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # 1. Avisa ao Docker para ler o arquivo dentro da pasta envs
    env_file:
      - envs/.env.local
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Usando o usuário root padrão do Postgres para garantir que o teste passe rápido
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - loja-network

  app:
    build: .
    restart: on-failure
    # 2. Avisa ao Docker para carregar o arquivo de ambiente no app também
    env_file:
      - envs/.env.local
    ports:
      - "${SERVER_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8080 # Porta interna que o container escuta (definida no Dockerfile)
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - loja-network

volumes:
  postgres-data:

networks:
  loja-network:
    driver: bridge
